name: BATMAN Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS native scaffolding
        run: flutter create --platforms=android,ios --project-name batman_mobile .
      - name: Apply microphone and speech permissions
        run: python3 tools/configure_platforms.py
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test
      - name: Build Android installable APK (testing)
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: BATMAN-Mobile-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
