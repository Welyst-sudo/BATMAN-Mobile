name: batman_mobile
publish_to: none
description: Asistente móvil BATMAN con IA, hábitos aprendidos, notificaciones y control remoto del PC.
version: 1.0.0+2
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  url_launcher: ^6.3.1
  http: ^1.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
